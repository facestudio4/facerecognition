services:
  - type: web
    name: face-studio-api
    env: python
    rootDir: .
    plan: free
    autoDeploy: true
    buildCommand: pip install -r config/requirements.txt
    startCommand: python scripts/app_runner.py api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: face-studio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: FaceRecognitionStudio
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8787"
      - key: SQLITE_PATH
        value: /var/data/facestudio.db
      - key: FACES_ROOT
        value: /var/data/faces
      - key: FACE_ENCODINGS_PATH
        value: /var/data/face_encodings.pkl
      # Durable persistence on the free tier (no disk): mirror the DB, encodings
      # and face images to Supabase Storage so data survives redeploys/sleep.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: facestudio-data
      - key: FACE_STUDIO_MOBILE_LATEST_VERSION
        value: 0.1.0+55
      - key: FACE_STUDIO_MOBILE_MIN_VERSION
        value: 0.1.0+33
      - key: FACE_STUDIO_MOBILE_APK_URL
        value: https://github.com/facestudio4/facerecognition/releases/download/v0.1.0%2B55/mobile_0.1.0%2B55.apk
      - key: FACE_STUDIO_MOBILE_UPDATE_NOTES
        value: Face Studio v0.1.0+55 — a richer Create studio (prompt ideas, aspect ratios, your creations) and a more inviting People tab.
      # Firebase Cloud Messaging service-account JSON (whole file as the value),
      # used to send push notifications. Keep secret.
      - key: FACESTUDIO_FCM_SERVICE_ACCOUNT
        sync: false
      # Hugging Face Inference API token (FREE) for realistic AI image generation
      # (description -> image + realistic filters). Without it, filters fall back
      # to local OpenCV effects. Get one at huggingface.co/settings/tokens.
      - key: HF_API_TOKEN
        sync: false
      # Optional model overrides (defaults: FLUX.1-schnell / instruct-pix2pix).
      - key: HF_TXT2IMG_MODEL
        sync: false
      - key: HF_IMG2IMG_MODEL
        sync: false
      # JaaS (8x8) for sign-in-free video/voice calls. When all three are set,
      # calls use 8x8.vc with a signed JWT; otherwise they fall back to meet.jit.si.
      - key: JAAS_APP_ID
        sync: false
      - key: JAAS_KID
        sync: false
      - key: JAAS_PRIVATE_KEY
        sync: false
      # Gallery-scan strictness — tune these without rebuilding the app. Higher
      # auto_save / min_margin = fewer wrong saves (more go to review).
      - key: MOBILE_GALLERY_AUTOSAVE
        value: "0.72"
      - key: MOBILE_GALLERY_REVIEW
        value: "0.55"
      - key: MOBILE_GALLERY_MARGIN
        value: "0.08"
      - key: FACE_STUDIO_MOBILE_FORCE_UPDATE
        value: "false"
      - key: MOBILE_RECOGNITION_THRESHOLD
        value: "0.48"
      - key: MOBILE_RECOGNITION_MARGIN
        value: "0.03"
      # --- Security hardening (see CLAUDE.md) ---
      # Move the backend API key / token secret OUT of the committed DB. Set
      # these to the CURRENT values to avoid breaking the app, or rotate them
      # (rotating the token secret forces all users to log in again).
      - key: FACESTUDIO_API_KEY
        sync: false
      - key: FACESTUDIO_TOKEN_SECRET
        sync: false
      # Browser CORS allowlist (comma-separated). Leave unset to lock it down;
      # native mobile clients are unaffected. Only set if a web frontend needs it.
      - key: FACESTUDIO_ALLOWED_ORIGINS
        sync: false
      # Must stay off in production (controls error-detail leakage).
      - key: FACESTUDIO_DEBUG
        value: "false"
      - key: FACESTUDIO_SIGNUP_ALLOW_SMTP_FALLBACK
        value: "1"
      # Render blocks outbound SMTP, so verification emails must go over an
      # HTTP email API. Set FACESTUDIO_BREVO_API_KEY (Brevo, free 300/day) and
      # verify the sender address (FACESTUDIO_SMTP_FROM) in the Brevo dashboard.
      - key: FACESTUDIO_BREVO_API_KEY
        sync: false
      - key: FACESTUDIO_EMAIL_FROM_NAME
        value: Face Studio
      - key: FACESTUDIO_SMTP_HOST
        sync: false
      - key: FACESTUDIO_SMTP_USER
        sync: false
      - key: FACESTUDIO_SMTP_APP_PASSWORD
        sync: false
      - key: FACESTUDIO_SMTP_FROM
        sync: false
      - key: FACESTUDIO_SMTP_PORT
        value: "587"
      - key: FACESTUDIO_SMTP_TLS
        value: "1"
      - key: FACESTUDIO_SMTP_SSL
        value: "0"
      - key: FACESTUDIO_SMTP_TIMEOUT
        value: "10"
      - key: FACESTUDIO_SMTP_TOTAL_TIMEOUT
        value: "9"
