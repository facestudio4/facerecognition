name: face_studio_mobile_client
description: Minimal mobile client for Face Studio backend API.
publish_to: "none"
version: 0.1.0+51

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  hive: ^2.2.3
  http: ^1.2.2
  image_picker: ^1.1.2
  photo_manager: ^3.6.4
  image: ^4.3.0
  video_thumbnail: ^0.5.3
  flutter_local_notifications: ^17.2.3
  flutter_tts: ^3.8.5
  geolocator: ^13.0.1
  package_info_plus: ^8.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  tflite_flutter: ^0.11.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.9.0
  vector_math: ^2.1.2
  flutter_contacts: ^1.1.9+2
  crypto: ^3.0.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  jitsi_meet_flutter_sdk: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.jpeg
    - assets/face_reference.png
    - assets/face_reference.jpeg
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.jpeg"
